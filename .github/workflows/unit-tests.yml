# Runs the unit tests on macOS, the only platform that Bloom supports. They use
# fakes for the keyboard and hidutil, so they need no keyboard.
name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.10"
          enable-cache: false
      - run: uv run --locked pytest
