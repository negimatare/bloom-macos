# Runs the unit tests on macOS, the only platform that Bloom supports. They use
# fakes for the keyboard and hidutil, so they need no keyboard.
name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Unit tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.10"
          enable-cache: false
      - run: uv run --locked pytest
