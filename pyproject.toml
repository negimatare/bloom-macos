[project]
name = "blackwidow"
version = "0.1.0"
description = "Backlight and key-mapping control for the Razer BlackWidow Lite on macOS"
readme = "README.md"
authors = [
    { name = "negimatare", email = "116022383+negimatare@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hidapi>=0.15.0",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
bw = "blackwidow.cli:main"
bw-gui = "blackwidow.gui.app:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
